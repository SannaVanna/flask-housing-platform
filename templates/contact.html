    {% extends "base.html" %}

    {% block title %}Contact Us - My Site{% endblock %}

    {% block content %}
    <body id="contact-page">
        <div class="form-container">
            <h2>Contact Us</h2>
            <form action="{{ url_for('submit') }}" method="POST">
                <label>Name:</label><br>
                <input type="text" name="name" placeholder="Enter full name"><br><br>

                <label>Email:</label><br>
                <input type="email" name="email" placeholder="example@email.com"><br><br>

                <label>Address:</label><br>
                <input type="text" name="address" placeholder="Enter your address"><br><br>

                <label>Message:</label><br>
                <textarea name="message" rows="5" required></textarea><br><br>
                <button type="submit">Send</button>
                <a href="{{ url_for('upload_form') }}">Upload a File</a>
            </form>
        </div>
    </body>
    {% endblock %}
